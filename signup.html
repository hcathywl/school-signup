<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學校活動報名系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1a2e; --ink-soft: #3d3d5c; --ink-muted: #8888aa;
  --paper: #faf9f6; --paper-warm: #f2efe8;
  --accent: #c45c3a; --border: #e0ddd6;
  --shadow: rgba(26,26,46,0.08);
  --success-light: #d4edda;
  --font-body: 'Noto Sans TC', sans-serif;
}
body { font-family: var(--font-body); background: var(--paper); color: var(--ink); min-height: 100vh; overflow-x: hidden; }
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 60% 40% at 15% 20%, rgba(196,92,58,0.06) 0%, transparent 60%),
              radial-gradient(ellipse 50% 50% at 85% 75%, rgba(45,122,74,0.05) 0%, transparent 60%);
}
/* ── HEADER ── */
.site-header { position: relative; z-index: 10; border-bottom: 1px solid var(--border); background: rgba(250,249,246,0.95); backdrop-filter: blur(8px); padding: 0 24px; }
.header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 60px; flex-wrap: wrap; gap: 8px; padding: 8px 0; }
.site-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; display: inline-block; transition: background 0.3s; flex-shrink: 0; }
.sync-dot.ok { background: #2d7a4a; }
.sync-dot.loading { background: #f5a623; animation: pulse 1s infinite; }
.sync-dot.err { background: #c0392b; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.nav-tabs { display: flex; gap: 4px; }
.nav-tab { padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--ink-muted); transition: all .18s; font-family: var(--font-body); }
.nav-tab:hover { background: var(--paper-warm); color: var(--ink); }
.nav-tab.active { background: var(--ink); color: #fff; }
/* ── LAYOUT ── */
.main { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }
.page { display: none; }
.page.active { display: block; animation: fadeIn .22s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
/* ── CARD ── */
.card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 32px 36px; box-shadow: 0 2px 16px var(--shadow); }
@media(max-width:600px){ .card { padding: 20px 18px; } }
/* ── HERO ── */
.activity-hero { background: var(--ink); color: #fff; border-radius: 16px; padding: 28px 36px; margin-bottom: 20px; position: relative; overflow: hidden; }
.activity-hero::after { content: '活動'; position: absolute; right: -16px; top: -16px; font-family: 'DM Serif Display', serif; font-size: 110px; opacity: .05; line-height: 1; pointer-events: none; }
.activity-name { font-family: 'DM Serif Display', serif; font-size: 26px; line-height: 1.3; margin-bottom: 6px; }
.activity-meta { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 14px; font-size: 13px; opacity: .85; }
.quota-section { margin-top: 18px; background: rgba(255,255,255,.1); border-radius: 10px; padding: 12px 16px; }
.quota-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 7px; opacity: .9; }
.quota-bar-track { background: rgba(255,255,255,.2); border-radius: 100px; height: 8px; overflow: hidden; }
.quota-bar-fill { height: 100%; border-radius: 100px; background: #fff; transition: width .6s ease; }
.quota-bar-fill.full { background: #f5a623; }
/* ── FORM ── */
.form-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 9px; }
.form-title-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media(max-width:520px){ .form-grid { grid-template-columns: 1fr; } }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1/-1; }
label { font-size: 13px; font-weight: 500; color: var(--ink-soft); }
input[type=text], input[type=email], input[type=password], input[type=number], textarea, select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 15px; font-family: var(--font-body); color: var(--ink); background: var(--paper);
  transition: border-color .15s, box-shadow .15s; outline: none;
}
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(196,92,58,.12); background: #fff; }
/* ── BUTTONS ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 26px; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: var(--font-body); border: none; cursor: pointer; transition: all .18s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #b04f30; transform: translateY(-1px); }
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--paper-warm); }
.btn-danger { background: transparent; color: #c0392b; border: 1px solid #f5c6c2; padding: 6px 12px; font-size: 13px; }
.btn-danger:hover { background: #fdf0ef; }
.btn-sm { padding: 7px 14px; font-size: 13px; }
/* ── ALERTS ── */
.alert { padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; display: flex; align-items: flex-start; gap: 9px; line-height: 1.5; }
.alert-success { background: var(--success-light); color: #1a5c34; border: 1px solid #a3d9b5; }
.alert-error { background: #fdf0ef; color: #9b2335; border: 1px solid #f5c6c2; }
.alert-info { background: #e8f0fe; color: #1a3a6e; border: 1px solid #b3c8f7; }
.alert .icon { flex-shrink: 0; }
/* ── STATUS LIST ── */
.reg-list-public { display: grid; gap: 7px; margin-top: 14px; max-height: 340px; overflow-y: auto; }
.reg-list-public::-webkit-scrollbar { width: 4px; }
.reg-list-public::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.reg-item-public { display: flex; align-items: center; gap: 10px; background: var(--paper-warm); border-radius: 8px; padding: 9px 12px; }
.reg-num { width: 22px; height: 22px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--ink-soft); flex-shrink: 0; }
/* ── ADMIN STATS ── */
.admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
@media(max-width:560px){ .admin-grid { grid-template-columns: 1fr; } }
.stat-card { background: var(--paper-warm); border-radius: 12px; padding: 18px 22px; display: flex; align-items: center; gap: 14px; }
.stat-icon { width: 42px; height: 42px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 19px; box-shadow: 0 1px 4px var(--shadow); flex-shrink: 0; }
.stat-label { font-size: 12px; color: var(--ink-muted); font-weight: 500; }
.stat-value { font-size: 26px; font-weight: 700; color: var(--ink); line-height: 1.2; }
/* ── TABLE ── */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { background: var(--paper-warm); padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--ink-muted); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
td { padding: 11px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: var(--paper); }
.seq { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--paper-warm); font-size: 11px; font-weight: 600; color: var(--ink-soft); }
.empty-state { text-align: center; padding: 40px 24px; color: var(--ink-muted); }
.empty-state .big { font-size: 34px; margin-bottom: 8px; }
/* ── SETTINGS ── */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
@media(max-width:520px){ .settings-grid { grid-template-columns: 1fr; } }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--border); }
.toggle-row:first-child { border-top: none; }
.toggle-info { flex: 1; }
.toggle-label { font-size: 14px; font-weight: 500; }
.toggle-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
.switch { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: var(--border); border-radius: 100px; cursor: pointer; transition: .2s; }
.slider::before { content: ''; position: absolute; width: 15px; height: 15px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
input:checked + .slider { background: var(--accent); }
input:checked + .slider::before { transform: translateX(17px); }
/* ── LOGIN ── */
.login-wrap { max-width: 380px; margin: 60px auto 0; }
.login-icon { width: 52px; height: 52px; background: var(--ink); border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 18px; }
/* ── LOADING ── */
#loading-screen { position: fixed; inset: 0; background: var(--paper); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.spinner { width: 38px; height: 38px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* ── TOAST ── */
#toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--ink); color: #fff; padding: 11px 22px; border-radius: 100px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 20px rgba(0,0,0,.2); z-index: 9999; transition: transform .3s; white-space: nowrap; }
#toast.show { transform: translateX(-50%) translateY(0); }
.divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
.section-title { font-size: 15px; font-weight: 700; }
#csv-link { display: none; }
</style>
</head>
<body>

<!-- ════ 請將下一行的 URL 換成你的 Apps Script 網址 ════ -->
<script>
const API_URL = 'YOUR_APPS_SCRIPT_URL_HERE';
</script>
<!-- ════════════════════════════════════════════════════ -->

<div id="loading-screen">
  <div class="spinner"></div>
  <div style="font-size:14px;color:#8888aa">載入中，請稍候…</div>
</div>

<header class="site-header">
  <div class="header-inner">
    <div class="site-title">🏫 學校報名系統 <span class="sync-dot loading" id="sync-dot"></span></div>
    <nav class="nav-tabs">
      <button class="nav-tab active" onclick="showPage('signup')">報名</button>
      <button class="nav-tab" onclick="showPage('status')">報名狀況</button>
      <button class="nav-tab" onclick="goAdmin()">後台管理</button>
    </nav>
  </div>
</header>

<main class="main">

  <!-- ══ SIGNUP ══ -->
  <div id="page-signup" class="page active">
    <div class="activity-hero">
      <div class="activity-name" id="display-title">活動名稱</div>
      <div id="display-desc" style="opacity:.75;font-size:13px;margin-top:5px;line-height:1.6"></div>
      <div class="activity-meta">
        <span>📅 <span id="display-date">—</span></span>
        <span>📍 <span id="display-location">—</span></span>
      </div>
      <div class="quota-section">
        <div class="quota-label">
          <span>報名進度</span>
          <span id="quota-text">— / — 人</span>
        </div>
        <div class="quota-bar-track"><div class="quota-bar-fill" id="quota-bar" style="width:0%"></div></div>
      </div>
    </div>

    <div class="card" id="form-card">
      <div id="signup-alert"></div>
      <div class="form-title"><span class="form-title-dot"></span>填寫報名資料</div>
      <div class="form-grid">
        <div class="form-group">
          <label>班級座號 *</label>
          <input type="text" id="field-class" placeholder="例：三年二班 15號">
        </div>
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" id="field-name" placeholder="請輸入姓名">
        </div>
        <div class="form-group full">
          <label>電子郵件 *</label>
          <input type="email" id="field-email" placeholder="example@mail.com">
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="submit-btn" onclick="submitSignup()">確認報名 →</button>
        <span style="font-size:12px;color:var(--ink-muted)">* 為必填欄位</span>
      </div>
    </div>

    <div class="card" id="closed-card" style="display:none;text-align:center;padding:48px 24px">
      <div style="font-size:44px;margin-bottom:14px">🔒</div>
      <div style="font-size:19px;font-weight:700;margin-bottom:7px">報名已截止</div>
      <div style="color:var(--ink-muted);font-size:13px">名額已滿或報名已關閉，感謝踴躍參與！</div>
    </div>
  </div>

  <!-- ══ STATUS ══ -->
  <div id="page-status" class="page">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">
        <div>
          <h2 style="font-size:19px;font-weight:700">報名狀況</h2>
          <div style="font-size:12px;color:var(--ink-muted);margin-top:2px">多裝置即時同步</div>
        </div>
        <div id="status-quota-badge" style="background:var(--paper-warm);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:500"></div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="loadData(true)" style="margin-bottom:14px">↻ 重新整理</button>
      <div id="status-list"></div>
    </div>
  </div>

  <!-- ══ ADMIN LOGIN ══ -->
  <div id="page-admin-login" class="page">
    <div class="login-wrap">
      <div class="card">
        <div class="login-icon">🔑</div>
        <h2 style="font-size:19px;font-weight:700;margin-bottom:5px">後台管理登入</h2>
        <p style="font-size:13px;color:var(--ink-muted);margin-bottom:20px">請輸入管理密碼</p>
        <div id="login-alert"></div>
        <div class="form-group" style="margin-bottom:14px">
          <label>管理密碼</label>
          <input type="password" id="admin-pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="doLogin()">登入 →</button>
      </div>
    </div>
  </div>

  <!-- ══ ADMIN PANEL ══ -->
  <div id="page-admin" class="page">
    <div class="admin-grid">
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div><div class="stat-label">報名人數</div><div class="stat-value" id="stat-count">—</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🎯</div>
        <div><div class="stat-label">剩餘名額</div><div class="stat-value" id="stat-remain">—</div></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <div class="section-head">
        <div class="section-title">📋 報名名單</div>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" onclick="loadData(true)">↻ 重新整理</button>
          <button class="btn btn-outline btn-sm" onclick="exportCSV()">⬇ 匯出 CSV</button>
          <button class="btn btn-danger" onclick="clearAll()">清空名單</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:36px">#</th>
            <th>班級座號</th><th>姓名</th><th>Email</th><th>報名時間</th><th>操作</th>
          </tr></thead>
          <tbody id="admin-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-bottom:18px">⚙️ 活動設定</div>
      <div class="settings-grid">
        <div class="form-group">
          <label>活動名稱</label>
          <input type="text" id="set-title" placeholder="例：親師座談志工招募">
        </div>
        <div class="form-group">
          <label>名額上限</label>
          <input type="number" id="set-quota" min="1" max="999" placeholder="例：20">
        </div>
        <div class="form-group">
          <label>活動日期</label>
          <input type="text" id="set-date" placeholder="例：2025/06/15（週日）">
        </div>
        <div class="form-group">
          <label>活動地點</label>
          <input type="text" id="set-location" placeholder="例：學校禮堂">
        </div>
        <div class="form-group full">
          <label>活動說明</label>
          <textarea id="set-desc" rows="3" placeholder="例：本次活動需協助佈置場地…"></textarea>
        </div>
      </div>
      <hr class="divider">
      <div style="margin-bottom:16px">
        <div class="toggle-row">
          <div class="toggle-info">
            <div class="toggle-label">開放報名</div>
            <div class="toggle-sub">關閉後報名頁面顯示「已截止」</div>
          </div>
          <label class="switch"><input type="checkbox" id="set-open" checked><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
          <div class="toggle-info">
            <div class="toggle-label">公開顯示報名者姓名</div>
            <div class="toggle-sub">關閉後「報名狀況」頁僅顯示人數</div>
          </div>
          <label class="switch"><input type="checkbox" id="set-show-names" checked><span class="slider"></span></label>
        </div>
        <div class="toggle-row" style="gap:12px">
          <div class="toggle-info">
            <div class="toggle-label">更改管理密碼</div>
            <div class="toggle-sub">留空則維持原密碼不變</div>
          </div>
          <input type="password" id="set-new-pw" placeholder="輸入新密碼" style="width:160px;font-size:13px;padding:7px 10px">
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-primary" onclick="saveSettings()">儲存設定</button>
        <button class="btn btn-outline" onclick="doLogout()">登出</button>
        <div id="settings-alert" style="flex:1"></div>
      </div>
    </div>
  </div>

</main>

<div id="toast"></div>
<a id="csv-link"></a>

<script>
// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let state = { settings: {}, registrants: [] };
let adminLoggedIn = false;
let adminPw = '';
let currentPage = 'signup';

// ══════════════════════════════════════════════
//  API HELPERS
// ══════════════════════════════════════════════
async function apiGet(params) {
  const url = API_URL + '?' + new URLSearchParams(params);
  const res = await fetch(url);
  return res.json();
}

async function apiPost(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(body)
  });
  return res.json();
}

// ══════════════════════════════════════════════
//  SYNC DOT
// ══════════════════════════════════════════════
function setSyncState(s) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot ' + s;
}

// ══════════════════════════════════════════════
//  LOAD DATA
// ══════════════════════════════════════════════
async function loadData(showMsg = false) {
  setSyncState('loading');
  try {
    const data = await apiGet({ action: 'getAll' });
    if (data.ok) {
      state.settings = data.settings;
      state.registrants = data.registrants;
      setSyncState('ok');
      renderCurrentPage();
      if (showMsg) showToast('資料已更新');
    } else {
      throw new Error(data.error);
    }
  } catch (e) {
    setSyncState('err');
    if (showMsg) showToast('連線失敗，請重試');
  }
}

// ══════════════════════════════════════════════
//  PAGE ROUTING
// ══════════════════════════════════════════════
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  const nav = document.querySelectorAll('.nav-tab');
  if (name === 'signup') nav[0].classList.add('active');
  if (name === 'status') { nav[1].classList.add('active'); loadData(); }
  if (name === 'admin' || name === 'admin-login') nav[2].classList.add('active');
  currentPage = name;
  renderCurrentPage();
}

function renderCurrentPage() {
  if (currentPage === 'signup') renderSignup();
  if (currentPage === 'status') renderStatus();
  if (currentPage === 'admin') renderAdmin();
}

function goAdmin() {
  if (adminLoggedIn) showPage('admin');
  else showPage('admin-login');
}

// ══════════════════════════════════════════════
//  RENDER: SIGNUP
// ══════════════════════════════════════════════
function renderSignup() {
  const s = state.settings;
  const count = state.registrants.length;
  const quota = parseInt(s.quota) || 30;
  const pct = Math.min(100, Math.round(count / quota * 100));
  const full = count >= quota;
  const isOpen = s.isOpen && !full;

  document.getElementById('display-title').textContent = s.title || '活動名稱';
  document.getElementById('display-desc').textContent = s.desc || '';
  document.getElementById('display-date').textContent = s.date || '—';
  document.getElementById('display-location').textContent = s.location || '—';
  document.getElementById('quota-text').textContent = `${count} / ${quota} 人`;
  const bar = document.getElementById('quota-bar');
  bar.style.width = pct + '%';
  bar.classList.toggle('full', full);
  document.getElementById('form-card').style.display = isOpen ? '' : 'none';
  document.getElementById('closed-card').style.display = isOpen ? 'none' : '';
}

// ══════════════════════════════════════════════
//  SUBMIT SIGNUP
// ══════════════════════════════════════════════
async function submitSignup() {
  const cls = document.getElementById('field-class').value.trim();
  const name = document.getElementById('field-name').value.trim();
  const email = document.getElementById('field-email').value.trim();

  if (!cls || !name || !email) { showAlert('signup-alert','error','⚠️ 請填寫所有必填欄位'); return; }
  if (!email.includes('@')) { showAlert('signup-alert','error','⚠️ 電子郵件格式不正確'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '提交中…';

  try {
    const res = await apiPost({ action: 'register', class: cls, name, email });
    if (res.ok) {
      document.getElementById('field-class').value = '';
      document.getElementById('field-name').value = '';
      document.getElementById('field-email').value = '';
      showAlert('signup-alert','success',`✅ 報名成功！${name} 已完成報名，目前共 ${res.count} / ${res.quota} 人`);
      showToast('報名成功！');
      await loadData();
    } else {
      showAlert('signup-alert','error','❌ ' + (res.error || '報名失敗'));
    }
  } catch {
    showAlert('signup-alert','error','❌ 連線失敗，請確認網路後重試');
  }

  btn.disabled = false; btn.textContent = '確認報名 →';
}

// ══════════════════════════════════════════════
//  RENDER: STATUS
// ══════════════════════════════════════════════
function renderStatus() {
  const s = state.settings;
  const regs = state.registrants;
  const quota = parseInt(s.quota) || 30;

  document.getElementById('status-quota-badge').textContent =
    `報名人數：${regs.length} / ${quota}　剩餘：${Math.max(0, quota - regs.length)}`;

  const listEl = document.getElementById('status-list');
  if (regs.length === 0) {
    listEl.innerHTML = `<div class="empty-state"><div class="big">📝</div><div>尚無人報名</div></div>`;
    return;
  }
  if (!s.showNames) {
    listEl.innerHTML = `<div class="alert alert-info"><span class="icon">ℹ️</span>目前已有 <strong>${regs.length} 人</strong> 報名，名單不公開顯示</div>`;
    return;
  }
  const items = regs.map((r, i) => `
    <div class="reg-item-public">
      <div class="reg-num">${i+1}</div>
      <div>
        <div style="font-weight:500;font-size:14px">${esc(r.name)}</div>
        <div style="font-size:12px;color:var(--ink-muted)">${esc(r.class)}</div>
      </div>
    </div>`).join('');
  listEl.innerHTML = `<div class="reg-list-public">${items}</div>`;
}

// ══════════════════════════════════════════════
//  ADMIN LOGIN
// ══════════════════════════════════════════════
function doLogin() {
  const pw = document.getElementById('admin-pw-input').value;
  if (!pw) return;
  if (pw === state.settings.password) {
    adminLoggedIn = true;
    adminPw = pw;
    document.getElementById('admin-pw-input').value = '';
    document.getElementById('login-alert').innerHTML = '';
    showPage('admin');
  } else {
    showAlert('login-alert','error','❌ 密碼錯誤，請重試');
    document.getElementById('admin-pw-input').value = '';
    document.getElementById('admin-pw-input').focus();
  }
}

function doLogout() {
  adminLoggedIn = false;
  adminPw = '';
  showPage('admin-login');
  showToast('已登出後台');
}

// ══════════════════════════════════════════════
//  RENDER: ADMIN
// ══════════════════════════════════════════════
function renderAdmin() {
  const s = state.settings;
  const regs = state.registrants;
  const quota = parseInt(s.quota) || 30;

  document.getElementById('stat-count').textContent = regs.length;
  document.getElementById('stat-remain').textContent = Math.max(0, quota - regs.length);
  document.getElementById('set-title').value = s.title || '';
  document.getElementById('set-quota').value = s.quota || 30;
  document.getElementById('set-date').value = s.date || '';
  document.getElementById('set-location').value = s.location || '';
  document.getElementById('set-desc').value = s.desc || '';
  document.getElementById('set-open').checked = !!s.isOpen;
  document.getElementById('set-show-names').checked = !!s.showNames;

  const tbody = document.getElementById('admin-tbody');
  if (regs.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="big">📭</div><div>尚無報名資料</div></div></td></tr>`;
    return;
  }
  tbody.innerHTML = regs.map((r, i) => `
    <tr>
      <td><span class="seq">${i+1}</span></td>
      <td>${esc(r.class)}</td>
      <td style="font-weight:500">${esc(r.name)}</td>
      <td style="color:var(--ink-soft);font-size:13px">${esc(r.email)}</td>
      <td style="color:var(--ink-muted);font-size:12px;white-space:nowrap">${esc(r.time)}</td>
      <td><button class="btn btn-danger" onclick="deleteReg('${r.id}')">刪除</button></td>
    </tr>`).join('');
}

// ══════════════════════════════════════════════
//  ADMIN ACTIONS
// ══════════════════════════════════════════════
async function deleteReg(id) {
  if (!confirm('確定要刪除這筆報名資料嗎？')) return;
  setSyncState('loading');
  try {
    const res = await apiPost({ action: 'deleteReg', password: adminPw, id });
    if (res.ok) { showToast('已刪除'); await loadData(); }
    else showToast('刪除失敗：' + res.error);
  } catch { showToast('連線失敗'); }
}

async function clearAll() {
  if (!confirm('確定要清空所有報名名單？此操作無法還原！')) return;
  setSyncState('loading');
  try {
    const res = await apiPost({ action: 'clearAll', password: adminPw });
    if (res.ok) { showToast('名單已清空'); await loadData(); }
    else showToast('失敗：' + res.error);
  } catch { showToast('連線失敗'); }
}

async function saveSettings() {
  const newPw = document.getElementById('set-new-pw').value.trim();
  const settings = {
    title: document.getElementById('set-title').value.trim(),
    quota: parseInt(document.getElementById('set-quota').value) || 30,
    date: document.getElementById('set-date').value.trim(),
    location: document.getElementById('set-location').value.trim(),
    desc: document.getElementById('set-desc').value.trim(),
    isOpen: document.getElementById('set-open').checked,
    showNames: document.getElementById('set-show-names').checked,
  };
  if (newPw) settings.newPassword = newPw;

  setSyncState('loading');
  try {
    const res = await apiPost({ action: 'saveSettings', password: adminPw, settings });
    if (res.ok) {
      if (newPw) { adminPw = newPw; }
      document.getElementById('set-new-pw').value = '';
      showAlert('settings-alert','success','✅ 設定已儲存並同步');
      setTimeout(() => { document.getElementById('settings-alert').innerHTML = ''; }, 3000);
      await loadData();
    } else {
      showAlert('settings-alert','error','❌ ' + res.error);
      setSyncState('err');
    }
  } catch {
    showAlert('settings-alert','error','❌ 連線失敗，請重試');
    setSyncState('err');
  }
}

function exportCSV() {
  const regs = state.registrants;
  if (regs.length === 0) { showToast('尚無報名資料'); return; }
  let csv = '\uFEFF序號,班級座號,姓名,Email,報名時間\n';
  regs.forEach((r, i) => {
    csv += `${i+1},${csvCell(r.class)},${csvCell(r.name)},${csvCell(r.email)},${csvCell(r.time)}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.getElementById('csv-link');
  a.href = URL.createObjectURL(blob);
  a.download = `報名名單_${state.settings.title || '活動'}_${new Date().toLocaleDateString('zh-TW')}.csv`;
  a.click();
  showToast('CSV 匯出成功');
}

// ══════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════
function showAlert(id, type, msg) {
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  document.getElementById(id).innerHTML =
    `<div class="alert alert-${type}"><span class="icon">${icons[type]}</span><span>${msg}</span></div>`;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function csvCell(s) {
  s = String(s||'');
  return (s.includes(',') || s.includes('"') || s.includes('\n')) ? `"${s.replace(/"/g,'""')}"` : s;
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
async function init() {
  await loadData();
  document.getElementById('loading-screen').style.display = 'none';
  // Auto-refresh every 30 sec
  setInterval(() => loadData(), 30000);
}

init();
</script>
